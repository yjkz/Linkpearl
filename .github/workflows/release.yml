name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Http/Frontend/package-lock.json

      - name: Setup Takumi Guard (npm supply chain protection)
        uses: flatt-security/setup-takumi-guard-npm@v1

      - name: Install frontend dependencies
        run: npm ci
        working-directory: Http/Frontend

      - name: Lint frontend
        run: npm run lint
        working-directory: Http/Frontend

      - name: Test frontend
        run: npm test
        working-directory: Http/Frontend

      - name: Build frontend
        run: npm run build
        working-directory: Http/Frontend

      - name: Refresh websiteBuild.zip
        run: |
          cd Http/Frontend
          rm -f ../../websiteBuild.zip
          zip -r ../../websiteBuild.zip dist/
          cd ../..

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          wget -q https://goatcorp.github.io/dalamud-distrib/latest.zip -O dalamud.zip
          mkdir -p "$HOME/dalamud"
          unzip -q dalamud.zip -d "$HOME/dalamud"

      - name: Build plugin
        run: dotnet build Linkpearl.sln -c Release -p:DalamudLibPath="$HOME/dalamud" -p:IsPlogonBuild=True

      - name: Package plugin
        run: |
          # DalamudPackager emits the correctly structured artifact at
          # bin/<Configuration>/<InternalName>/latest.zip (DLL + manifest +
          # dependencies + dist/). Publish it under a stable asset name.
          cp bin/Release/Linkpearl/latest.zip Linkpearl.zip

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: Linkpearl
          path: Linkpearl.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Linkpearl.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update pluginmaster.json
        if: startsWith(github.ref, 'refs/tags/')
        run: python3 scripts/update-pluginmaster.py bin/Release/Linkpearl.json "$GITHUB_REF_NAME"

      - name: Commit release metadata
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add websiteBuild.zip pluginmaster.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: release ${GITHUB_REF_NAME}"
            git push origin HEAD:main
          fi
